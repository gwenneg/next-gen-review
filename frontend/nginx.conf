server {
    listen 80;
    root /usr/share/nginx/html;

    # Look up the api again every 10s through Docker's DNS, so a restarted api with a new IP is
    # found. A fixed name in proxy_pass is looked up only once, when nginx starts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # $http_host keeps the port, so the api's WebSocket Origin check sees the same host as the browser.
    location /api/ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
